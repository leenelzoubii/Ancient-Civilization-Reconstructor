<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/logo/favicon-64.png" />
    <link rel="apple-touch-icon" href="/logo/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACR — Ancient Civilization Reconstructor</title>
    <meta name="description" content="ACR (Ancient Civilization Reconstructor) — explore 8 historical sites, from Ancient Egypt, Rome and the Maya to the UAE's Khor Fakkan Fort, Al-Jazirat Al-Hamra and Dhayah Fort, through 3D photogrammetry models, videos, and AI-powered artifact restoration." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before the first paint so dark mode never flashes.
      (function () {
        try {
          var saved = localStorage.getItem('acr.theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
